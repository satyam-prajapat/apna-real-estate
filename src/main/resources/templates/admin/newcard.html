<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Service</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f8f9fa; padding: 50px; text-align: center;">

    <div style="background: white; padding: 30px; border-radius: 8px; width: 400px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
        <h2>Add New Service Card</h2>
        
        <form action="/admin/service/save" method="POST">
            <p><strong>Service Title:</strong></p>
            <input type="text" name="title" placeholder="e.g., Cloud Computing" required style="width: 90%; padding: 10px; margin-bottom: 10px;">
            
            <p><strong>Description:</strong></p>
            <textarea name="description" rows="4" placeholder="Briefly describe the service..." required style="width: 90%; padding: 10px;"></textarea>
            
            <br><br>
            <button type="submit" style="width: 95%; padding: 12px; background: #27ae60; color: white; border: none; cursor: pointer; font-size: 16px; font-weight: bold;">Save Service</button>
        </form>
        
        <br>
        <a href="/admin/dashboard" style="color: #7f8c8d; text-decoration: none;">← Cancel & Go Back</a>
    </div>

</body>
</html>
